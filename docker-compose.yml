services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
      - PORT=3000
    depends_on:
      order-worker:
        condition: service_started
    # Do not mount src here so built /app/dist isn't overwritten
    command: npm start

  order-worker:
    build:
      context: ./backend/order-worker
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
    # Do not mount src here so built /app/dist isn't overwritten
    command: npm start

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev
